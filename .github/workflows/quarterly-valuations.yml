name: Quarterly Point Valuations Sync

on:
  schedule:
    # Mid-month, quarterly: Jan 15, Apr 15, Jul 15, Oct 15 at midnight UTC
    - cron: '0 0 15 1,4,7,10 *'
  workflow_dispatch:

jobs:
  sync-valuations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Fetch and parse valuations data
        run: |
          python3 scripts/scrape_valuations.py
        continue-on-error: true

      - name: Validate valuations
        run: ./validate-valuations.sh
        continue-on-error: true

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Valuations Sync Bot"
          git config user.email "valuations@github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Commit if changed
        run: |
          if ! git diff --quiet point-valuations.json; then
            git add point-valuations.json
            git commit -m "Quarterly sync: Update point valuations from Upgraded Points"
            git push origin main
            echo "✅ Valuations updated and pushed"
          else
            echo "✅ No changes detected"
          fi
        continue-on-error: true

      - name: Report status
        run: |
          echo "## Quarterly Point Valuations Sync" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Next sync**: Three months from now" >> $GITHUB_STEP_SUMMARY
