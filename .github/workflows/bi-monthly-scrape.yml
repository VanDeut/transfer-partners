name: Bi-Monthly Roame Sync

on:
  schedule:
    # Last day of every other month at midnight UTC
    # Sept 30, Nov 30, Jan 31, Mar 31, May 31, Jul 31
    - cron: '0 0 30 9,11,1,3,5,7 *'
  workflow_dispatch:

jobs:
  sync-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Fetch and parse Roame data
        id: sync
        run: |
          python3 scripts/scrape_roame.py
        continue-on-error: true

      - name: Validate JSON
        run: ./validate.sh
        continue-on-error: true

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Roame Sync Bot"
          git config user.email "sync@github.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Commit if changed
        run: |
          if ! git diff --quiet transfer-partners.json; then
            git add transfer-partners.json
            git commit -m "Bi-monthly sync: Update transfer rates from Roame"
            git push origin main
            echo "✅ Rates updated and pushed"
          else
            echo "✅ No changes detected"
          fi
        continue-on-error: true

      - name: Report status
        run: |
          echo "## Bi-Monthly Roame Sync" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Next sync**: Two months from now" >> $GITHUB_STEP_SUMMARY
