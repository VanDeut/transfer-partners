name: Weekly Roame Sync

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync-roame:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Download Roame data
        id: download
        run: |
          python3 << 'EOF'
          import requests
          import os
          from datetime import datetime
          from pathlib import Path

          # Try to extract Roame's download link
          url = "https://roame.travel/transfer-partners-cheat-sheet"

          try:
              response = requests.get(url, timeout=10)
              response.raise_for_status()

              # Look for download link in the page
              # Note: This may need updating if Roame changes their page structure
              if 'download' in response.text.lower():
                  print("✅ Found Roame page with download content")

                  # Try common export patterns
                  # Save page content for manual inspection if needed
                  html_file = f"roame-page-{datetime.now().strftime('%Y-%m-%d')}.html"
                  with open(html_file, 'w') as f:
                      f.write(response.text)

                  with open('ROAME_DOWNLOAD_STATUS.txt', 'w') as f:
                      f.write("⚠️ Roame page downloaded but extraction needs manual confirmation\n")
                      f.write(f"Downloaded: {datetime.now().isoformat()}\n")
                      f.write(f"URL: {url}\n\n")
                      f.write("Next step: Manually download from Roame and run compare script\n")

                  print("::set-output name=status::needs_manual_download")
              else:
                  print("⚠️ Could not find download link on Roame page")
                  print("::set-output name=status::page_inaccessible")

          except requests.RequestException as e:
              print(f"❌ Error fetching Roame page: {e}")
              print("::set-output name=status::fetch_failed")
          EOF
        continue-on-error: true

      - name: Check for manual Roame uploads
        id: check_upload
        run: |
          # Look for recently uploaded Roame files
          latest_roame=$(ls -t roame-source-*.csv 2>/dev/null | head -1)

          if [ -n "$latest_roame" ]; then
              echo "Found Roame file: $latest_roame"
              echo "::set-output name=roame_file::$latest_roame"
              echo "::set-output name=found::true"
          else
              echo "No roame-source-*.csv file found"
              echo "::set-output name=found::false"
          fi

      - name: Run comparison if Roame file exists
        id: compare
        if: steps.check_upload.outputs.found == 'true'
        run: |
          echo "📊 Running comparison against: ${{ steps.check_upload.outputs.roame_file }}"
          python3 scripts/compare_roame.py "${{ steps.check_upload.outputs.roame_file }}" > comparison_output.txt 2>&1
          cat comparison_output.txt

          # Check if there are changes
          if grep -q "CHANGED\|NEW" comparison_output.txt; then
              echo "::set-output name=changes_found::true"
              echo "Changes detected!"
          else
              echo "::set-output name=changes_found::false"
              echo "No changes detected"
          fi
        continue-on-error: true

      - name: Validate JSON
        run: ./validate.sh
        continue-on-error: true

      - name: Configure Git
        run: |
          git config user.name "Transfer Partners Bot"
          git config user.email "action@github.com"

      - name: Commit changes if found
        if: steps.compare.outputs.changes_found == 'true'
        run: |
          git add transfer-partners.json
          git diff --cached --quiet || git commit -m "Auto-sync transfer rates from Roame

Updated rates detected during weekly sync.

Source file: ${{ steps.check_upload.outputs.roame_file }}
Comparison output: See workflow logs for details

Co-Authored-By: Transfer Partners Bot <action@github.com>"

      - name: Push changes
        if: steps.compare.outputs.changes_found == 'true'
        run: |
          git push origin main

      - name: Create issue if manual download needed
        if: steps.check_upload.outputs.found == 'false'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📥 Manual Action Needed: Download Roame Data',
              body: `⏰ Weekly transfer rate sync requires manual action.

## What to do:

1. Visit https://roame.travel/transfer-partners-cheat-sheet
2. Click the **Download** button
3. Save the file as: \`roame-source-$(date +%Y-%m-%d).csv\`
4. Commit to this repository:
   \`\`\`bash
   git add roame-source-*.csv
   git commit -m "Add Roame source data for weekly sync"
   git push
   \`\`\`

The workflow will then:
- Run comparison automatically
- Detect any rate changes
- Auto-commit updates if found

[See AUTOMATION.md for details](../../blob/main/AUTOMATION.md)

---
*This issue was auto-generated by GitHub Actions*`,
              labels: ['automation', 'documentation']
            })

      - name: Summary
        run: |
          echo "## Weekly Roame Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Roame File Found:** ${{ steps.check_upload.outputs.found }}" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Detected:** ${{ steps.compare.outputs.changes_found || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_upload.outputs.found }}" = "false" ]; then
            echo "⚠️ **Action Needed:** Download latest Roame data and commit it" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Steps:" >> $GITHUB_STEP_SUMMARY
            echo "1. Visit https://roame.travel/transfer-partners-cheat-sheet" >> $GITHUB_STEP_SUMMARY
            echo "2. Click Download button" >> $GITHUB_STEP_SUMMARY
            echo "3. Save as: \`roame-source-YYYY-MM-DD.csv\`" >> $GITHUB_STEP_SUMMARY
            echo "4. Commit and push" >> $GITHUB_STEP_SUMMARY
          fi
