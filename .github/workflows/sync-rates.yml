name: Sync Transfer Rates from Roame

on:
  schedule:
    # Run daily at 9 AM UTC
    - cron: '0 9 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and sync rates
        id: sync
        run: python3 scripts/sync_roame_rates.py
        continue-on-error: true

      - name: Validate changes
        run: ./validate.sh
        continue-on-error: true

      - name: Configure Git
        run: |
          git config user.name "Transfer Partners Bot"
          git config user.email "action@github.com"

      - name: Commit changes
        if: steps.sync.outputs.changes_found == 'true'
        run: |
          git add transfer-partners.json
          git commit -m "Auto-update transfer rates from Roame

Detected changes:
${{ steps.sync.outputs.changes_summary }}

Source: https://roame.travel/transfer-partners-cheat-sheet
Updated: $(date -u +'%Y-%m-%d %H:%M:%SZ')

This is an automated commit from GitHub Actions.
Co-Authored-By: Transfer Partners Bot <action@github.com>"

      - name: Push changes
        if: steps.sync.outputs.changes_found == 'true'
        run: |
          git push origin main

      - name: Create issue if errors
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Transfer Rates Sync Failed',
              body: '❌ The automated Roame sync workflow failed.\n\nCheck the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.',
              labels: ['automation', 'bug']
            })

      - name: Summary
        run: |
          echo "## Transfer Rates Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Found:** ${{ steps.sync.outputs.changes_found }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.sync.outputs.changes_found }}" = "true" ]; then
            echo "**Summary:**" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.sync.outputs.changes_summary }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No changes detected" >> $GITHUB_STEP_SUMMARY
          fi
